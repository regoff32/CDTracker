name: Build Android APK and Debian package

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '*.py'
      - 'packaging/**'
      - 'README.txt'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.CDT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cdtracker.jks"
            echo "CDT_KEYSTORE=$RUNNER_TEMP/cdtracker.jks" >> "$GITHUB_ENV"
            echo "Signing with the CDTracker release key."
          else
            echo "::warning::No CDT_KEYSTORE_BASE64 secret - APK is signed with a temporary debug key."
          fi

      - name: Build APK
        working-directory: android
        env:
          CDT_KEYSTORE_PASSWORD: ${{ secrets.CDT_KEYSTORE_PASSWORD }}
          CDT_KEY_ALIAS: ${{ secrets.CDT_KEY_ALIAS }}
          CDT_KEY_PASSWORD: ${{ secrets.CDT_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "CDTracker-$VERSION.apk"

      - name: Build Debian package
        run: |
          DEB=$(sh packaging/build-deb.sh)
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          DEB_VERSION=$(dpkg-deb -f "$DEB" Version)
          if [ "$DEB_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch: Android $VERSION, Debian $DEB_VERSION. Change both together."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CDTracker-${{ env.VERSION }}
          path: |
            CDTracker-${{ env.VERSION }}.apk
            ${{ env.DEB }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "CDTracker-$VERSION.apk" "$DEB" --clobber
          else
            gh release create "$TAG" "CDTracker-$VERSION.apk" "$DEB" \
              --title "CDTracker $VERSION" \
              --notes "Android: download the .apk on the phone and open it to install. Debian: download the .deb and install it with: sudo apt install ./$(basename "$DEB")"
          fi
